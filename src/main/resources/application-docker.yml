server:
  port: 8080
  
spring:
  datasource:
    url: jdbc:mysql://user-db:3306/order_db?serverTimezone=Europe/Berlin
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: kafka:9092
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gwatcho-shop
          jwk-set-uri: http://keycloak:8080/realms/gwatcho-shop/protocol/openid-connect/certs  